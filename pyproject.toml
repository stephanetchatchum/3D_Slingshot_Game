[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-slingshot-game"
version = "0.1.0"
description = "A 3D gravitational slingshot simulation using Newtonian mechanics and numerical integration."
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.4",
    "ursina==8.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]